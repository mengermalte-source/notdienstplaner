{% extends "base.html" %}
{% block title %}Passwort ändern{% endblock %}
{% block content %}

<div class="mb-6">
  <h1 class="text-2xl font-bold">Passwort ändern</h1>
</div>

<div class="bg-white rounded-xl border border-gray-200 p-6 max-w-md">
  {% if success %}
  <div class="bg-green-50 border border-green-200 rounded-lg p-4 mb-5 text-green-800 text-sm font-medium">
    Passwort erfolgreich geändert.
  </div>
  {% endif %}

  {% if error %}
  <div class="bg-red-50 border border-red-200 rounded-lg p-4 mb-5 text-red-800 text-sm">
    {{ error }}
  </div>
  {% endif %}

  <form method="post" action="/me/password" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Aktuelles Passwort</label>
      <input type="password" name="current_password" required
             class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Neues Passwort</label>
      <input type="password" name="new_password" required minlength="6"
             class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
      <p class="text-xs text-gray-500 mt-1">Mindestens 6 Zeichen</p>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Neues Passwort bestätigen</label>
      <input type="password" name="confirm_password" required
             class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
    </div>
    <button type="submit"
            class="w-full bg-blue-600 text-white px-4 py-2.5 rounded-lg hover:bg-blue-700 text-sm font-medium mt-2">
      Passwort speichern
    </button>
  </form>
</div>

{% endblock %}

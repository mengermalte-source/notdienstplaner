{% extends "base.html" %}
{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50">
  <div class="max-w-md w-full bg-white rounded-lg shadow p-8">
    <h1 class="text-2xl font-bold text-center mb-6">Notdienstplaner</h1>
    {% if error %}
    <div class="bg-red-50 border border-red-300 text-red-700 px-4 py-2 rounded mb-4">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Benutzername</label>
        <input type="text" name="email" required
          class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Passwort</label>
        <input type="password" name="password" required
          class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary-500">
      </div>
      <button type="submit"
        class="w-full bg-accent-500 text-white py-2 px-4 rounded-md hover:bg-accent-700 transition">
        Anmelden
      </button>
    </form>
  </div>
</div>
{% endblock %}

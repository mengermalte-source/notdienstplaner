[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "notdienstplaner"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.*",
    "uvicorn[standard]==0.32.*",
    "sqlmodel==0.0.22",
    "alembic==1.14.*",
    "aiosqlite==0.20.*",
    "pydantic-settings==2.6.*",
    "python-jose[cryptography]==3.3.*",
    "passlib[bcrypt]==1.7.*",
    "python-multipart==0.0.19",
    "jinja2==3.1.*",
    "aiofiles==24.*",
    "itsdangerous==2.2.*",
    "holidays>=0.34",
    "ortools>=9.10",
    "icalendar==6.*",
    "weasyprint==63.*",
    "httpx==0.28.*",
]

[project.optional-dependencies]
dev = [
    "pytest==8.*",
    "pytest-asyncio==0.25.*",
    "anyio==4.*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools]
packages = ["app"]
